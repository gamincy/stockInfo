<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My PSE Portfolio</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --text:#14171a; --muted:#6b7280;
    --border:#e5e7eb; --accent:#0b5fff; --up:#0a8a3d; --down:#c11f2b;
    --input-bg:#ffffff;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1115; --card:#171a21; --text:#eef1f5; --muted:#9aa4b2;
      --border:#2a2f3a; --accent:#5b9bff; --up:#33c46a; --down:#ff5b6a;
      --input-bg:#12141a;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:16px;max-width:820px;margin:0 auto;}
  h1{font-size:1.25rem;margin:8px 0 16px}
  h2{font-size:1rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:24px 0 8px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:16px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
  .stat{padding:4px 0}
  .stat .label{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .stat .value{font-size:1.35rem;font-weight:600;margin-top:2px}
  .updated{font-size:.75rem;color:var(--muted);margin-top:10px}
  table{width:100%;border-collapse:collapse;font-size:.85rem}
  th,td{text-align:right;padding:8px 6px;border-bottom:1px solid var(--border);white-space:nowrap}
  th:first-child,td:first-child{text-align:left}
  th{color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--card)}
  .up{color:var(--up)} .down{color:var(--down)}
  .table-wrap{overflow-x:auto;max-height:60vh;overflow-y:auto}
  .controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  input,select{background:var(--input-bg);color:var(--text);border:1px solid var(--border);
    border-radius:8px;padding:8px 10px;font-size:.9rem}
  input[type=text]{flex:1;min-width:120px}
  .muted{color:var(--muted);font-size:.85rem}
  .error{color:var(--down);font-size:.85rem}
  .holding-row td{cursor:default}
</style>
</head>
<body>
  <h1>My PSE Portfolio</h1>
  <p class="muted">claude was here</p>

  <h2>Account Summary</h2>
  <div class="card">
    <div class="stats" id="summary-stats">
      <div class="stat"><div class="label">Buying Power</div><div class="value">&mdash;</div></div>
      <div class="stat"><div class="label">Total Portfolio Value</div><div class="value">&mdash;</div></div>
      <div class="stat"><div class="label">Current Stocks Value</div><div class="value">&mdash;</div></div>
    </div>
    <div class="updated" id="summary-updated"></div>
  </div>

  <div class="card" id="holdings-card" hidden>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Symbol</th><th>Shares</th><th>Avg Price</th><th>Current</th><th>Market Value</th><th>Gain/Loss</th></tr></thead>
        <tbody id="holdings-body"></tbody>
      </table>
    </div>
  </div>

  <h2>PSE Daily Data</h2>
  <div class="card">
    <div class="controls">
      <select id="date-select"></select>
      <input type="text" id="symbol-filter" placeholder="Filter symbol (e.g. AC, ALI)">
    </div>
    <div id="data-status" class="muted"></div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Symbol</th><th>Last</th><th>Change</th><th>%Chg</th>
            <th>Open</th><th>High</th><th>Low</th><th>Volume</th><th>Value</th>
          </tr>
        </thead>
        <tbody id="data-body"></tbody>
      </table>
    </div>
  </div>

<script>
(function(){
  const fmt = (n, opts) => Number(n).toLocaleString('en-PH', opts || {maximumFractionDigits: 2});
  const money = (n) => '₱' + fmt(n, {minimumFractionDigits:2, maximumFractionDigits:2});

  // --- Account summary ---
  fetch('accounts/PSE/account-details.json', {cache: 'no-store'})
    .then(r => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)))
    .then(acct => {
      const statsEl = document.getElementById('summary-stats');
      statsEl.innerHTML = `
        <div class="stat"><div class="label">Buying Power</div><div class="value">${money(acct.buyingPower || 0)}</div></div>
        <div class="stat"><div class="label">Total Portfolio Value</div><div class="value">${money(acct.totalPortfolioValue || 0)}</div></div>
        <div class="stat"><div class="label">Current Stocks Value</div><div class="value">${money(acct.currentStocksValue || 0)}</div></div>
      `;
      if (acct.lastUpdated) {
        const d = new Date(acct.lastUpdated);
        document.getElementById('summary-updated').textContent =
          'Last updated ' + (isNaN(d) ? acct.lastUpdated : d.toLocaleString());
      }
      if (Array.isArray(acct.holdings) && acct.holdings.length) {
        const body = document.getElementById('holdings-body');
        body.innerHTML = acct.holdings.map(h => {
          const mv = (h.shares || 0) * (h.currentPrice || 0);
          const cost = (h.shares || 0) * (h.avgPrice || 0);
          const gl = mv - cost;
          const cls = gl > 0 ? 'up' : (gl < 0 ? 'down' : '');
          return `<tr class="holding-row">
            <td style="text-align:left">${h.symbol}</td>
            <td>${fmt(h.shares || 0)}</td>
            <td>${fmt(h.avgPrice || 0)}</td>
            <td>${fmt(h.currentPrice || 0)}</td>
            <td>${money(mv)}</td>
            <td class="${cls}">${gl >= 0 ? '+' : ''}${money(gl)}</td>
          </tr>`;
        }).join('');
        document.getElementById('holdings-card').hidden = false;
      }
    })
    .catch(err => {
      document.getElementById('summary-updated').innerHTML =
        `<span class="error">Could not load account-details.json (${err.message}).</span>`;
    });

  // --- PSE daily data explorer ---
  const dateSelect = document.getElementById('date-select');
  const symbolFilter = document.getElementById('symbol-filter');
  const dataBody = document.getElementById('data-body');
  const dataStatus = document.getElementById('data-status');
  let currentRows = [];

  function renderRows(){
    const q = symbolFilter.value.trim().toUpperCase();
    const rows = q ? currentRows.filter(r => r[0].toUpperCase().includes(q)) : currentRows;
    dataBody.innerHTML = rows.map(cols => {
      const [sym, prevClose, last, change, pctChange, open, high, low, value, trades, volume] = cols;
      const chgNum = parseFloat(change);
      const cls = chgNum > 0 ? 'up' : (chgNum < 0 ? 'down' : '');
      return `<tr>
        <td style="text-align:left">${sym}</td>
        <td>${last}</td>
        <td class="${cls}">${change}</td>
        <td class="${cls}">${pctChange}</td>
        <td>${open}</td><td>${high}</td><td>${low}</td>
        <td>${volume}</td><td>${value}</td>
      </tr>`;
    }).join('');
    dataStatus.textContent = `${rows.length} of ${currentRows.length} symbols`;
  }

  function loadDate(date){
    dataStatus.textContent = 'Loading ' + date + '...';
    fetch(`data/PSE/csv/Data_${date}.txt`, {cache: 'no-store'})
      .then(r => r.ok ? r.text() : Promise.reject(new Error('HTTP ' + r.status)))
      .then(text => {
        currentRows = text.trim().split('\n').filter(Boolean).map(line => line.split(':'));
        renderRows();
      })
      .catch(err => {
        dataBody.innerHTML = '';
        dataStatus.innerHTML = `<span class="error">Could not load data for ${date} (${err.message}).</span>`;
      });
  }

  fetch('data/PSE/manifest.json', {cache: 'no-store'})
    .then(r => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)))
    .then(manifest => {
      const dates = manifest.dates || [];
      dateSelect.innerHTML = dates.slice().reverse()
        .map(d => `<option value="${d}">${d}</option>`).join('');
      if (dates.length) loadDate(dates[dates.length - 1]);
    })
    .catch(err => {
      dataStatus.innerHTML = `<span class="error">Could not load data/PSE/manifest.json (${err.message}). Run scripts/generate_manifest.py and push.</span>`;
    });

  dateSelect.addEventListener('change', () => loadDate(dateSelect.value));
  symbolFilter.addEventListener('input', renderRows);
})();
</script>
</body>
</html>
